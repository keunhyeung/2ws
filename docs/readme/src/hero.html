<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>2WS hero</title>
<link rel="stylesheet" href="phone.css">
<style>
  html, body { width: 880px; height: 400px; overflow: hidden; }
  .card {
    position: relative;
    width: 880px;
    height: 400px;
    border-radius: 40px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
  }
  :root[data-theme="dark"] .card { box-shadow: inset 0 0 0 1px var(--line); }
  /* keep the 1px edge above the phones in the dark card */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 40px;
    pointer-events: none;
    z-index: 10;
  }
  :root[data-theme="dark"] .card::after { box-shadow: inset 0 0 0 1px var(--line); }
  .copy {
    position: absolute;
    left: 56px;
    top: 0;
    bottom: 0;
    width: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mark { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .tag { margin-top: 22px; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.28; }
  .sub { margin-top: 18px; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-3); white-space: nowrap; }
  .phones .phone-wrap { position: absolute; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="mark">2WS</div>
    <div class="tag">투자자산운용사<br>시험 학습 웹앱</div>
    <div class="sub">설치·가입·광고 없음 · 오프라인 동작</div>
  </div>
  <div class="phones" id="phones"></div>
</div>
<script src="phone.js"></script>
<script>
  var t = themeFromQuery();
  var host = document.getElementById('phones');
  var K = 470 / 868, KS = K * 0.86;
  function put(name, k, left, top) {
    var p = phone(name, t.theme, k, true);
    p.style.left = left + 'px';
    p.style.top = top + 'px';
    host.appendChild(p);
  }
  put('dict', KS, 337, 92);      /* back left */
  put('explain', KS, 674, 92);  /* back right */
  put('quiz', K, 490, 48);      /* front center */
  whenReady();
</script>
</body>
</html>
